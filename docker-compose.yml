services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/url_shortener?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTO_MIGRATE: "true"
      SEED_DEFAULT_ACCOUNTS: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
